name: Android app

# Builds the APK that watches the monitor from a phone. The artifact of a run on
# the default branch is what you sideload; there is no store distribution, and no
# signing key in this repository, so the build is debug signed.

on:
  push:
    branches: [main]
    paths: ['android/**', '.github/workflows/android.yml']
  pull_request:
    paths: ['android/**', '.github/workflows/android.yml']
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Build the APK
        working-directory: android
        run: gradle --no-daemon assembleDebug

      - name: Upload the APK
        uses: actions/upload-artifact@v4
        with:
          name: babymonitor-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
